name: Update Streak Stats

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Download streak stats image
        run: |
          curl -o assets/github-streak-stats.svg "https://nirzak-streak-stats.vercel.app/?user=Hemil195&theme=dark&hide_border=false"

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/github-streak-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update streak stats" && git push)
